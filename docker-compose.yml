services:
  stream-cache:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CACHE_DIR: /data/cache
      DATABASE_PATH: /data/cache.sqlite
      MAX_CACHE_BYTES: 10737418240
      CHUNK_SIZE_BYTES: 4194304
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW: 1 minute
      REQUEST_TIMEOUT_MS: 30000
      MAX_UPSTREAM_REDIRECTS: 3
      LOG_LEVEL: info
      ADDON_PUBLIC_BASE_URL: http://127.0.0.1:3000
      ADDON_NAME: AIOStreams Proxy Cache
      ADDON_ID: community.aiostreams.proxy-cache
      # Set this to your configured AIOStreams addon base URL.
      # AIOSTREAMS_ADDON_URL: http://example.com/your-aiostreams-addon
    volumes:
      - stream-cache-data:/data
    restart: unless-stopped

volumes:
  stream-cache-data:
